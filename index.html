<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Códigos</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- QuaggaJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

    <!-- SheetJS para Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>

<body class="bg-gray-100 p-4">

    <h1 class="text-2xl font-bold text-center mb-4">Escáner de Códigos de Barras</h1>

    <!-- Contenedor del scanner -->
    <div class="bg-white p-4 rounded-lg shadow mb-4">
        <video id="preview" class="w-full rounded"></video>

        <button id="btnStart" class="w-full bg-blue-600 text-white py-2 px-4 rounded mt-3">
            Iniciar Escáner
        </button>

        <button id="btnStop" class="w-full bg-red-600 text-white py-2 px-4 rounded mt-3 hidden">
            Detener Escáner
        </button>
    </div>

    <!-- Tabla -->
    <h2 class="text-xl font-bold mb-2">Datos Escaneados</h2>

    <div class="overflow-x-auto bg-white p-4 rounded shadow">
        <table class="w-full text-sm" id="tablaDatos">
            <thead class="bg-gray-200">
                <tr>
                    <th class="p-2">Código</th>
                    <th class="p-2">Descripción</th>
                    <th class="p-2">Fecha</th>
                    <th class="p-2">Ubicación</th>
                    <th class="p-2">Usuario</th>
                    <th class="p-2">Observaciones</th>
                    <th class="p-2">Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <button id="btnExcel" class="w-full bg-green-600 text-white py-2 px-4 rounded mt-4">
        Exportar a Excel
    </button>

    <script>
        const tabla = document.querySelector("#tablaDatos tbody");

        // Evitar duplicados
        const codigosCapturados = new Set();

        // ================================
        //      INICIAR SCANNER
        // ================================
        document.getElementById("btnStart").onclick = () => {
            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#preview'),
                    constraints: {
                        facingMode: "environment"
                    }
                },
                decoder: {
                    readers: ["code_128_reader", "ean_reader"]
                }
            }, err => {
                if (err) {
                    alert("Error iniciando cámara: " + err);
                    return;
                }
                Quagga.start();
                document.getElementById("btnStart").classList.add("hidden");
                document.getElementById("btnStop").classList.remove("hidden");
            });

            Quagga.onDetected(data => {
                const codigo = data.codeResult.code;

                if (!codigosCapturados.has(codigo)) {
                    codigosCapturados.add(codigo);
                    agregarFila(codigo);
                }
            });
        };

        // ================================
        //      DETENER SCANNER
        // ================================
        document.getElementById("btnStop").onclick = () => {
            Quagga.stop();
            document.getElementById("btnStart").classList.remove("hidden");
            document.getElementById("btnStop").classList.add("hidden");
        };

        // ================================
        //      AGREGAR FILA A TABLA
        // ================================
        function agregarFila(codigo) {
            const fila = document.createElement("tr");

            fila.innerHTML = `
                <td class="border p-2 font-bold">${codigo}</td>
                <td class="border p-2" contenteditable="true"></td>
                <td class="border p-2" contenteditable="true">${new Date().toLocaleString()}</td>
                <td class="border p-2" contenteditable="true"></td>
                <td class="border p-2" contenteditable="true"></td>
                <td class="border p-2" contenteditable="true"></td>
                <td class="border p-2 text-center">
                    <button class="bg-red-500 text-white px-2 py-1 rounded text-xs eliminar">X</button>
                </td>
            `;

            tabla.appendChild(fila);

            // Evento eliminar
            fila.querySelector(".eliminar").onclick = () => {
                codigosCapturados.delete(codigo);
                fila.remove();
            };
        }

        // ================================
        //      EXPORTAR A EXCEL
        // ================================
        document.getElementById("btnExcel").onclick = () => {
            const datos = [];
            document.querySelectorAll("#tablaDatos tbody tr").forEach(tr => {
                const tds = tr.querySelectorAll("td");
                datos.push({
                    Codigo: tds[0].innerText,
                    Descripcion: tds[1].innerText,
                    Fecha: tds[2].innerText,
                    Ubicacion: tds[3].innerText,
                    Usuario: tds[4].innerText,
                    Observaciones: tds[5].innerText
                });
            });

            const hoja = XLSX.utils.json_to_sheet(datos);
            const libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "Datos");

            XLSX.writeFile(libro, "escaneos.xlsx");
        };
    </script>

</body>
</html>
