<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Códigos</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- QuaggaJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body class="bg-gray-100 p-4">

    <h1 class="text-2xl font-bold text-center mb-4">Escáner de Códigos de Barras</h1>

    <!-- Scanner -->
    <div class="bg-white p-4 rounded-lg shadow mb-4">
        <video id="preview" class="w-full rounded"></video>

        <button id="btnStart" class="w-full bg-blue-600 text-white py-2 px-4 rounded mt-3">
            Iniciar Escáner
        </button>

        <button id="btnStop" class="w-full bg-red-600 text-white py-2 px-4 rounded mt-3 hidden">
            Detener Escáner
        </button>
    </div>

    <!-- Tabla -->
    <h2 class="text-xl font-bold mb-2">Datos Escaneados</h2>

    <div class="overflow-x-auto bg-white p-4 rounded shadow">
        <table class="w-full text-sm" id="tablaDatos">
            <thead class="bg-gray-200">
                <tr>
                    <th class="p-2">Código</th>
                    <th class="p-2">Nombre Producto</th>
                    <th class="p-2">Lote</th>
                    <th class="p-2">Fecha Fab</th>
                    <th class="p-2">Fecha Exp</th>
                    <th class="p-2">PVMP</th>
                    <th class="p-2">SAIMED PP</th>
                    <th class="p-2">Descripción</th>
                    <th class="p-2">Ubicación</th>
                    <th class="p-2">Usuario</th>
                    <th class="p-2">Observaciones</th>
                    <th class="p-2">Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <button id="btnExcel" class="w-full bg-green-600 text-white py-2 px-4 rounded mt-4">
        Exportar a Excel
    </button>

    <script>
        const tabla = document.querySelector("#tablaDatos tbody");
        const codigosCapturados = new Set();

        // ================================
        // INICIAR SCANNER
        // ================================
        document.getElementById("btnStart").onclick = () => {
            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#preview'),
                    constraints: { facingMode: "environment" }
                },
                decoder: { readers: ["code_128_reader", "ean_reader"] }
            }, err => {
                if (err) return alert("Error iniciando cámara: " + err);

                Quagga.start();
                document.getElementById("btnStart").classList.add("hidden");
                document.getElementById("btnStop").classList.remove("hidden");
            });

            Quagga.onDetected(data => {
                const codigo = data.codeResult.code;

                if (!codigosCapturados.has(codigo)) {
                    codigosCapturados.add(codigo);
                    agregarFilaConSchema(codigo);
                }
            });
        };

        // ================================
        // DETENER SCANNER
        // ================================
        document.getElementById("btnStop").onclick = () => {
            Quagga.stop();
            document.getElementById("btnStart").classList.remove("hidden");
            document.getElementById("btnStop").classList.add("hidden");
        };

        // ================================
        // SCHEMA AUTOMÁTICO
        // ================================
        const schema = {
            "Nombre Producto": "",
            "Lote": "",
            "Fecha Fab": "",
            "Fecha Exp": "",
            "PVMP": "",
            "SAIMED PP": "",
            "Descripcion": "",
            "Ubicacion": "",
            "Usuario": "",
            "Observaciones": ""
        };

        // ================================
        // AGREGAR FILA CON SCHEMA
        // ================================
        function agregarFilaConSchema(codigo) {
            const fila = document.createElement("tr");

            fila.innerHTML = `
                <td class="border p-2 font-bold">${codigo}</td>
                ${Object.keys(schema).map(k => `
                    <td class="border p-2" contenteditable="true">${schema[k]}</td>
                `).join("")}
                <td class="border p-2 text-center">
                    <button class="bg-red-500 text-white px-2 py-1 rounded text-xs eliminar">X</button>
                </td>
            `;

            tabla.appendChild(fila);

            fila.querySelector(".eliminar").onclick = () => {
                codigosCapturados.delete(codigo);
                fila.remove();
            };
        }

        // ================================
        // EXPORTAR A EXCEL
        // ================================
        document.getElementById("btnExcel").onclick = () => {
            const datos = [];

            document.querySelectorAll("#tablaDatos tbody tr").forEach(tr => {
                const t = tr.querySelectorAll("td");
                datos.push({
                    Codigo: t[0].innerText,
                    "Nombre Producto": t[1].innerText,
                    Lote: t[2].innerText,
                    "Fecha Fab": t[3].innerText,
                    "Fecha Exp": t[4].innerText,
                    PVMP: t[5].innerText,
                    "SAIMED PP": t[6].innerText,
                    Descripcion: t[7].innerText,
                    Ubicacion: t[8].innerText,
                    Usuario: t[9].innerText,
                    Observaciones: t[10].innerText
                });
            });

            const hoja = XLSX.utils.json_to_sheet(datos);
            const libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "Datos");
            XLSX.writeFile(libro, "escaneos.xlsx");
        };
    </script>

</body>
</html>
